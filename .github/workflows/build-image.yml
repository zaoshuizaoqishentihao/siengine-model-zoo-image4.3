name: build-model-zoo-image

# 单文件版：把 Dockerfile 内联在 workflow 里，仓库里只需要这一个文件。
# 用法：GitHub 仓库 → Add file → Create new file → 文件名填
#   .github/workflows/build-image.yml
# 粘贴本文件 → Commit → Actions → build-model-zoo-image → Run workflow。

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (e.g. v0.4.3)"
        required: true
        default: "v0.4.3"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space (image ~10GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          df -h /

      - name: Write Dockerfile
        run: |
          cat > Dockerfile <<'DOCKERFILE'
          # syntax=docker/dockerfile:1.6
          #
          # Self-contained ONLINE build of the unified Model Zoo image (GPU + CPU).
          #
          # Everything is downloaded from public sources at build time:
          #   - nvidia/cuda base image (Docker Hub)
          #   - python:3.11-slim builder (Docker Hub)
          #   - onnxruntime-gpu / cupy-cuda12x / fastrlock (PyPI, versions pinned)
          #   - ARM GNU toolchain 10.3-2021.07 (developer.arm.com, checksum verified)
          #   - onnxruntime C++ 1.22.0 (GitHub releases, sha256 verified)
          #
          # Requirements: Docker with network access to Docker Hub, PyPI, GitHub and
          # developer.arm.com. No local build inputs are needed (single Dockerfile).
          #
          # Build:
          #   docker build -f tools/docker/Dockerfile.online \
          #       -t siengine-model-zoo:v0.4.3 tools/docker
          #
          # Behind an HTTP proxy:
          #   docker build -f tools/docker/Dockerfile.online \
          #       --build-arg HTTP_PROXY=$http_proxy --build-arg HTTPS_PROXY=$https_proxy \
          #       -t siengine-model-zoo:v0.4.3 tools/docker

          ARG BASE_IMAGE=nvidia/cuda:12.4.1-cudnn-devel-ubuntu20.04
          ARG BUILDER_IMAGE=python:3.11-slim

          ARG TOOLCHAIN_URL=https://developer.arm.com/-/media/Files/downloads/gnu-a/10.3-2021.07/binrel/gcc-arm-10.3-2021.07-x86_64-aarch64-none-linux-gnu.tar.xz
          ARG TOOLCHAIN_MD5=07bbe2b5277b75ba36a924e9136366a4

          ARG ORT_VERSION=1.22.0
          ARG ORT_URL=https://github.com/microsoft/onnxruntime/releases/download/v1.22.0/onnxruntime-linux-x64-1.22.0.tgz
          ARG ORT_SHA256=8344d55f93d5bc5021ce342db50f62079daf39aaafb5d311a451846228be49b3

          # ---------------------------------------------------------------------------
          # Stage 1: GPU Python packages (pinned versions), installed into a target dir.
          # ---------------------------------------------------------------------------
          FROM ${BUILDER_IMAGE} AS gpu-deps

          RUN pip install --no-cache-dir --no-deps --target=/gpu-pkgs \
                onnxruntime-gpu==1.26.0 \
                cupy-cuda12x==12.3.0 \
                fastrlock==0.8.3

          RUN test -d /gpu-pkgs/onnxruntime && test -d /gpu-pkgs/cupy

          # ---------------------------------------------------------------------------
          # Stage 2: runtime image (no Python; Python comes from the mounted MX).
          # ---------------------------------------------------------------------------
          FROM ${BASE_IMAGE}

          ENV DEBIAN_FRONTEND=noninteractive

          RUN apt-get update && apt-get install -y --no-install-recommends \
                make cmake git wget curl ca-certificates xz-utils vim \
                zlib1g-dev libc6-dev gcc-multilib g++-multilib \
                libncurses5 libglib2.0-0 libsm6 libxext6 libxrender-dev libgl1-mesa-glx \
              && rm -rf /var/lib/apt/lists/* \
              && ln -s /usr/bin/make /usr/bin/gmake

          # ARM cross toolchain (MX envsetup looks for this exact directory name).
          RUN curl -fsSL -o /tmp/toolchain.tar.xz "${TOOLCHAIN_URL}" \
           && echo "${TOOLCHAIN_MD5}  /tmp/toolchain.tar.xz" | md5sum -c - \
           && tar -xf /tmp/toolchain.tar.xz -C /opt \
           && rm -f /tmp/toolchain.tar.xz \
           && test -d /opt/gcc-arm-10.3-2021.07-x86_64-aarch64-none-linux-gnu/bin

          # C++ ONNX Runtime used by the FM build (envsetup looks in /opt/thirdparty).
          RUN mkdir -p /opt/thirdparty \
           && curl -fsSL -o /opt/thirdparty/onnxruntime-linux-x64-${ORT_VERSION}.tgz "${ORT_URL}" \
           && echo "${ORT_SHA256}  /opt/thirdparty/onnxruntime-linux-x64-${ORT_VERSION}.tgz" | sha256sum -c - \
           && tar -xzf /opt/thirdparty/onnxruntime-linux-x64-${ORT_VERSION}.tgz -C /opt/thirdparty \
           && test -d /opt/thirdparty/onnxruntime-linux-x64-${ORT_VERSION}

          # GPU Python packages used by the mounted MX Python 3.11.
          COPY --from=gpu-deps /gpu-pkgs/ \
               /opt/siengine/py311-gpu/lib/python3.11/site-packages/

          # Entrypoint (kept self-contained so this Dockerfile is the only file needed).
          RUN printf '%s\n' \
                '#!/bin/bash' \
                'echo ""' \
                'echo "====================================================="' \
                'echo "Welcome to use siengine model zoo docker container!"' \
                'echo "====================================================="' \
                'echo ""' \
                'exec "$@"' > /entrypoint.sh \
           && chmod +x /entrypoint.sh

          RUN test -d /opt/siengine/py311-gpu/lib/python3.11/site-packages/onnxruntime \
           && test -d /opt/gcc-arm-10.3-2021.07-x86_64-aarch64-none-linux-gnu/bin \
           && test -f /opt/thirdparty/onnxruntime-linux-x64-1.22.0.tgz \
           && test -d /opt/thirdparty/onnxruntime-linux-x64-1.22.0

          LABEL org.opencontainers.image.title="siengine-model-zoo" \
                mx.compat="2.2" \
                gpu.ort="1.26.0" \
                ort.cpp="1.22.0" \
                build.mode="online"

          WORKDIR /model_zoo
          ENTRYPOINT ["/entrypoint.sh"]
          DOCKERFILE
          echo "--- Dockerfile written: $(wc -l < Dockerfile) lines ---"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ inputs.tag }}

      - name: Smoke test
        run: |
          IMG="ghcr.io/${{ github.repository }}:${{ inputs.tag }}"
          docker run --rm --entrypoint bash "$IMG" -c '
            set -e
            test -d /opt/siengine/py311-gpu/lib/python3.11/site-packages/onnxruntime
            test -d /opt/siengine/py311-gpu/lib/python3.11/site-packages/cupy
            test -d /opt/gcc-arm-10.3-2021.07-x86_64-aarch64-none-linux-gnu/bin
            test -f /opt/thirdparty/onnxruntime-linux-x64-1.22.0.tgz
            test -d /opt/thirdparty/onnxruntime-linux-x64-1.22.0
            echo SMOKE_TEST_OK
          '

      - name: Show image size
        run: |
          IMG="ghcr.io/${{ github.repository }}:${{ inputs.tag }}"
          docker image inspect "$IMG" --format 'image={{.RepoTags}} size={{.Size}
